# ============================================================
#  Baut die Firmware automatisch bei jedem Hochladen (Push).
#  - Ergebnis zum Herunterladen unter "Actions" -> Lauf anklicken -> Artifacts
#  - Bei einem Versions-Tag (z.B. v1.0.0) entsteht ein Release mit den Dateien
#  - Der Online-Flasher (GitHub Pages) wird mit der neuesten Firmware aktualisiert
#
#  Zwei Autos und die App, drei unabhaengige Builds (laufen gleichzeitig, einer bremst den anderen nicht aus):
#    mini - ESP32-S3 Super Mini      (Codes/roboauto_pio)            -> Pages: /
#    xiao - XIAO ESP32S3 Sense       (Codes/roboauto_pio/xiao_sense) -> Pages: /xiao/
#    app  - Roboauto-App fuer Android (Codes/roboauto_app)           -> Pages: /roboauto.apk
#  Danach setzt "veroeffentlichen" die Seite aus dem zusammen, was fertig geworden ist.
#  Ist ein Build fehlgeschlagen, bleiben dafuer die bisherigen Dateien online.
# ============================================================
name: Firmware bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Codes/roboauto_pio/**', 'Codes/roboauto_app/**', '.github/**']   # nur bauen, wenn sich am Code etwas aendert
  pull_request:
    paths: ['Codes/roboauto_pio/**', 'Codes/roboauto_app/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------- ESP32-S3 Super Mini ----------
  mini:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Codes/roboauto_pio      # hier liegt das PlatformIO-Projekt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO-Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-mini-${{ hashFiles('Codes/roboauto_pio/platformio.ini') }}

      - name: PlatformIO und esptool installieren
        run: pip install platformio esptool==4.8.1

      - name: Geheime Dateien aus den Vorlagen anlegen (leer)
        run: |
          cp geheim.beispiel.ini geheim.ini
          cp include/wlan_zugang.beispiel.h include/wlan_zugang.h

      - name: Firmware bauen (mit Build-Nummer fuer das Auto-Update)
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_BUILD=${{ github.run_number }}
        run: pio run -e roboauto

      - name: Alles in eine Datei packen (fuer den Online-Flasher)
        run: |
          B=.pio/build/roboauto
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n 1)
          mkdir -p ausgabe
          python -m esptool --chip esp32s3 merge_bin -o ausgabe/roboauto-komplett.bin \
            --flash_mode dio --flash_size 4MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin ausgabe/roboauto-update.bin
          # Einzelteile fuer das Flasher-Update (ueberschreibt die gespeicherten Einstellungen NICHT)
          mkdir -p ausgabe/teile
          cp $B/bootloader.bin $B/partitions.bin "$BOOT_APP0" $B/firmware.bin ausgabe/teile/
          ls -la ausgabe

      - name: Ergebnis aufheben
        uses: actions/upload-artifact@v4
        with:
          name: roboauto-firmware
          path: Codes/roboauto_pio/ausgabe/

  # ---------- XIAO ESP32S3 Sense ----------
  xiao:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Codes/roboauto_pio/xiao_sense   # eigenes PlatformIO-Projekt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO-Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-xiao-${{ hashFiles('Codes/roboauto_pio/xiao_sense/platformio.ini') }}

      - name: PlatformIO und esptool installieren
        run: pip install platformio esptool==4.8.1

      - name: Geheime Dateien aus den Vorlagen anlegen (leer)
        run: |
          cp geheim.beispiel.ini geheim.ini
          cp include/wlan_zugang.beispiel.h include/wlan_zugang.h

      - name: Firmware bauen (gleiche Build-Nummer wie der Super Mini)
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_BUILD=${{ github.run_number }}
        run: pio run -e roboauto_xiao

      - name: Alles in eine Datei packen (8 MB Flash)
        run: |
          B=.pio/build/roboauto_xiao
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n 1)
          mkdir -p ausgabe/teile
          # flash_mode keep: der XIAO-Bootloader ist schon fuer QIO gebaut
          python -m esptool --chip esp32s3 merge_bin -o ausgabe/roboauto-xiao-komplett.bin \
            --flash_mode keep --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin ausgabe/roboauto-xiao-update.bin
          cp $B/bootloader.bin $B/partitions.bin "$BOOT_APP0" $B/firmware.bin ausgabe/teile/
          ls -la ausgabe

      - name: Ergebnis aufheben
        uses: actions/upload-artifact@v4
        with:
          name: roboauto-xiao-firmware
          path: Codes/roboauto_pio/xiao_sense/ausgabe/

  # ---------- Roboauto-App (Android-APK) ----------
  #  Die Weboberflaeche kommt direkt aus der Firmware (include/webseite.h).
  #  Signieren: Damit sich neue Versionen ueber die alte installieren lassen, braucht jede APK
  #  denselben Schluessel. Er liegt in den GitHub-Secrets (siehe Codes/roboauto_app/README.md):
  #    ROBOAUTO_KEYSTORE_BASE64, ROBOAUTO_KEYSTORE_PASSWORT
  #  Fehlen sie, wird mit einem Wegwerf-Schluessel signiert (Update dann nur nach Deinstallieren).
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Codes/roboauto_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Signierschluessel bereitlegen
        env:
          KEYSTORE: ${{ secrets.ROBOAUTO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/roboauto.jks"
            echo "ROBOAUTO_KEYSTORE=$RUNNER_TEMP/roboauto.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signierschluessel hinterlegt - APK laesst sich nicht ueber eine alte Version installieren"
          fi

      - name: APK bauen
        env:
          ROBOAUTO_KEYSTORE_PASSWORT: ${{ secrets.ROBOAUTO_KEYSTORE_PASSWORT }}
        # Fehler zusaetzlich als Annotation ausgeben - die sieht man auch ohne Anmeldung auf der Lauf-Seite
        run: |
          set -o pipefail
          if ! gradle assembleRelease --no-daemon 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong" -A3 build.log | head -n 30 | while IFS= read -r z; do echo "::error::$z"; done
            exit 1
          fi

      - name: APK + Versionsinfo fuer die Webseite
        run: |
          mkdir -p ausgabe
          cp app/build/outputs/apk/release/app-release.apk ausgabe/roboauto.apk
          GROESSE=$(stat -c %s ausgabe/roboauto.apk)
          echo "{\"version\":\"1.0.${GITHUB_RUN_NUMBER}\",\"groesse\":${GROESSE},\"commit\":\"${GITHUB_SHA::7}\"}" > ausgabe/app.json
          cat ausgabe/app.json

      - name: Ergebnis aufheben
        uses: actions/upload-artifact@v4
        with:
          name: roboauto-app
          path: Codes/roboauto_app/ausgabe/

  # ---------- Release + Online-Flasher aus allen Builds ----------
  veroeffentlichen:
    needs: [mini, xiao, app]
    # laeuft, sobald mindestens ein Build geklappt hat (nicht bei Pull-Requests)
    if: always() && github.event_name != 'pull_request' && (needs.mini.result == 'success' || needs.xiao.result == 'success' || needs.app.result == 'success')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Codes/roboauto_pio
    steps:
      - uses: actions/checkout@v4

      - name: Fertige Builds holen
        uses: actions/download-artifact@v4
        with:
          path: Codes/roboauto_pio/artefakte    # je Build ein Unterordner (fehlt, wenn der Build gescheitert ist)

      - name: Release anlegen (nur bei Versions-Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Codes/roboauto_pio/artefakte/roboauto-firmware/roboauto-komplett.bin
            Codes/roboauto_pio/artefakte/roboauto-firmware/roboauto-update.bin
            Codes/roboauto_pio/artefakte/roboauto-xiao-firmware/roboauto-xiao-komplett.bin
            Codes/roboauto_pio/artefakte/roboauto-xiao-firmware/roboauto-xiao-update.bin
            Codes/roboauto_pio/artefakte/roboauto-app/roboauto.apk
          fail_on_unmatched_files: false        # ein gescheiterter Build soll das Release nicht verhindern
          generate_release_notes: true

      - name: Online-Flasher vorbereiten
        if: github.ref == 'refs/heads/main'
        env:
          LIVE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p seite/xiao
          cp -r docs/* seite/
          VERSION="Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"

          # version.json: danach schaut das Auto beim Auto-Update - jedes Auto in seinem eigenen Ordner
          versionsdatei() {   # $1 = Ordner, $2 = Update-Datei
            GROESSE=$(stat -c %s "$1/$2")
            MD5=$(md5sum "$1/$2" | cut -d' ' -f1)
            echo "{\"build\":${GITHUB_RUN_NUMBER},\"datei\":\"$2\",\"groesse\":${GROESSE},\"md5\":\"${MD5}\",\"commit\":\"${GITHUB_SHA::7}\"}" > "$1/version.json"
            cat "$1/version.json"
          }
          # Build gescheitert -> die bisherigen Dateien von der Live-Seite uebernehmen (sonst waeren sie weg)
          uebernehmen() {     # $1 = Ordner auf der Seite ("" oder "xiao"), Rest = Dateinamen
            ORDNER=$1; shift
            echo "!! Build fehlt - uebernehme bisherige Dateien fuer /${ORDNER}"
            for D in "$@"; do
              curl -fsSL "${LIVE}/${ORDNER:+$ORDNER/}$D" -o "seite/${ORDNER:+$ORDNER/}$D" || echo "   (nicht vorhanden: $D)"
            done
          }

          A=artefakte/roboauto-firmware
          if [ -d "$A" ]; then
            cp $A/roboauto-komplett.bin $A/roboauto-update.bin $A/teile/* seite/
            sed -i "s/__VERSION__/${VERSION}/" seite/manifest-*.json
            versionsdatei seite roboauto-update.bin
          else
            uebernehmen "" manifest-neu.json manifest-update.json version.json roboauto-komplett.bin roboauto-update.bin \
                           bootloader.bin partitions.bin boot_app0.bin firmware.bin
          fi

          X=artefakte/roboauto-xiao-firmware
          if [ -d "$X" ]; then
            cp $X/roboauto-xiao-komplett.bin $X/roboauto-xiao-update.bin $X/teile/* seite/xiao/
            sed -i "s/__VERSION__/${VERSION}/" seite/xiao/manifest-*.json
            versionsdatei seite/xiao roboauto-xiao-update.bin
          else
            uebernehmen xiao manifest-neu.json manifest-update.json version.json roboauto-xiao-komplett.bin \
                             roboauto-xiao-update.bin bootloader.bin partitions.bin boot_app0.bin firmware.bin
          fi

          # Android-App: zum Herunterladen direkt auf der Seite (app.json = Version + Groesse fuer die Anzeige)
          P=artefakte/roboauto-app
          if [ -d "$P" ]; then
            cp $P/roboauto.apk $P/app.json seite/
          else
            uebernehmen "" roboauto.apk app.json
          fi

          sed -i "s/__VERSION__/${VERSION}/" seite/index.html
          find seite -maxdepth 2 -type f | sort    # (kein "| head": mit pipefail bricht das den Schritt ab)

      - name: Flasher-Seite hochladen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Codes/roboauto_pio/seite

  flasher:
    needs: veroeffentlichen
    if: always() && github.ref == 'refs/heads/main' && needs.veroeffentlichen.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
