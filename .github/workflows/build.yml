# ============================================================
#  Baut die Firmware automatisch bei jedem Hochladen (Push).
#  - Ergebnis zum Herunterladen unter "Actions" -> Lauf anklicken -> Artifacts
#  - Bei einem Versions-Tag (z.B. v1.0.0) entsteht ein Release mit den Dateien
#  - Der Online-Flasher (GitHub Pages) wird mit der neuesten Firmware aktualisiert
# ============================================================
name: Firmware bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Codes/roboauto_pio/**', '.github/**']   # nur bauen, wenn sich am Code etwas aendert
  pull_request:
    paths: ['Codes/roboauto_pio/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  bauen:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Codes/roboauto_pio      # hier liegt das PlatformIO-Projekt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: PlatformIO-Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('Codes/roboauto_pio/platformio.ini') }}

      - name: PlatformIO und esptool installieren
        run: pip install platformio esptool==4.8.1

      - name: Geheime Dateien aus den Vorlagen anlegen (leer)
        run: |
          cp geheim.beispiel.ini geheim.ini
          cp include/wlan_zugang.beispiel.h include/wlan_zugang.h

      - name: Firmware bauen (mit Build-Nummer fuer das Auto-Update)
        env:
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_BUILD=${{ github.run_number }}
        run: pio run -e roboauto

      - name: Alles in eine Datei packen (fuer den Online-Flasher)
        run: |
          B=.pio/build/roboauto
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n 1)
          mkdir -p ausgabe
          python -m esptool --chip esp32s3 merge_bin -o ausgabe/roboauto-komplett.bin \
            --flash_mode dio --flash_size 4MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          cp $B/firmware.bin ausgabe/roboauto-update.bin
          # Einzelteile fuer das Flasher-Update (ueberschreibt die gespeicherten Einstellungen NICHT)
          mkdir -p ausgabe/teile
          cp $B/bootloader.bin $B/partitions.bin "$BOOT_APP0" $B/firmware.bin ausgabe/teile/
          ls -la ausgabe

      - name: Ergebnis aufheben
        uses: actions/upload-artifact@v4
        with:
          name: roboauto-firmware
          path: Codes/roboauto_pio/ausgabe/

      - name: Release anlegen (nur bei Versions-Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Codes/roboauto_pio/ausgabe/roboauto-komplett.bin
            Codes/roboauto_pio/ausgabe/roboauto-update.bin
          generate_release_notes: true

      - name: Online-Flasher vorbereiten
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p seite
          cp docs/* seite/
          cp ausgabe/roboauto-komplett.bin seite/
          cp ausgabe/roboauto-update.bin seite/
          cp ausgabe/teile/* seite/
          sed -i "s/__VERSION__/Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})/" seite/manifest-*.json seite/index.html
          # version.json: danach schaut das Auto beim Auto-Update
          GROESSE=$(stat -c %s seite/roboauto-update.bin)
          MD5=$(md5sum seite/roboauto-update.bin | cut -d' ' -f1)
          echo "{\"build\":${GITHUB_RUN_NUMBER},\"datei\":\"roboauto-update.bin\",\"groesse\":${GROESSE},\"md5\":\"${MD5}\",\"commit\":\"${GITHUB_SHA::7}\"}" > seite/version.json
          cat seite/version.json

      - name: Flasher-Seite hochladen
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Codes/roboauto_pio/seite

  flasher:
    needs: bauen
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
