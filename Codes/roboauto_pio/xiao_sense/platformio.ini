; Roboauto - Seeed Studio XIAO ESP32S3 Sense
; (8 MB Flash, 8 MB PSRAM, Kamera, Mikrofon, SD-Karte)
; Eigenes PlatformIO-Projekt: in VS Code den Ordner "xiao_sense" oeffnen.

; Passwort fuer WLAN-Updates steht in geheim.ini
[platformio]
extra_configs = geheim.ini
default_envs = roboauto_xiao

; ------------------------------------------------------------
; Upload per USB-Kabel
; ------------------------------------------------------------
[env:roboauto_xiao]
platform = platformio/espressif32 @ 8.0.0   ; gleiche Version wie beim Super Mini
board = seeed_xiao_esp32s3
framework = arduino

; 8 MB Flash: zwei Programmplaetze mit je 3,2 MB (Updates ueber WLAN) + 1,5 MB Dateispeicher
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; PSRAM (8 MB) einschalten - braucht die Kamera fuer ihre Bildpuffer
board_build.arduino.memory_type = qio_opi

; Weboberflaeche vor jedem Build mit gzip packen (-> include/webseite_gz.h)
extra_scripts = pre:scripts/webseite_gz.py

; USB-Anschluss des Autos. Aendert sich der Port, hier anpassen - oder beide Zeilen mit ; auskommentieren.
; upload_port  = COM8
; monitor_port = COM8

monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Dabble hat in ungenutzten Modulen fehlende returns -> nur Warnung statt Abbruch
    -Wno-error=return-type
    '-DOTA_PASSWORT="${geheim.ota_passwort}"'
build_unflags =
    -Werror=return-type

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    ; DabbleESP32 liegt lokal in lib/DabbleESP32 (Kopie aus dem Arduino-Ordner)
    ; Kamera (esp32-camera), Mikrofon (ESP_I2S) und SD gehoeren zum Arduino-Kern

; ------------------------------------------------------------
; Upload ueber WLAN (ohne Kabel): Umgebung "env:roboauto_xiao_wlan" waehlen, dann Upload (->).
; ------------------------------------------------------------
[env:roboauto_xiao_wlan]
extends = env:roboauto_xiao
upload_protocol = espota
upload_port = roboauto.local
upload_flags =
    --auth=${geheim.ota_passwort}
