; Roboauto - ESP32-S3 Super Mini
; Neuaufbau mit PlatformIO, Schritt fuer Schritt

; Passwort fuer WLAN-Updates steht in geheim.ini
[platformio]
extra_configs = geheim.ini
default_envs = roboauto

; ------------------------------------------------------------
; Upload per USB-Kabel
; ------------------------------------------------------------
[env:roboauto]
platform = platformio/espressif32 @ 8.0.0   ; feste Version - GitHub baut damit genau wie dein PC
board = esp32-s3-devkitc-1
framework = arduino

; Super Mini hat 4 MB Flash
board_upload.flash_size = 4MB
; Mehr Platz fuers Programm (WLAN + Bluetooth) und zwei Programmplaetze fuer spaetere
; Updates ueber WLAN: 2 x 1,9 MB statt 2 x 1,25 MB
board_build.partitions = min_spiffs.csv

; Weboberflaeche vor jedem Build mit gzip packen (-> include/webseite_gz.h)
extra_scripts = pre:scripts/webseite_gz.py

; USB-Anschluss des Autos fest einstellen (sonst raet PlatformIO manchmal falsch).
; Aendert sich der Port, hier anpassen - oder beide Zeilen mit ; auskommentieren.
upload_port  = COM8
monitor_port = COM8

; Serieller Monitor ueber den USB-C-Anschluss
monitor_speed = 115200
build_flags =
    ; Steuerung per Dabble-App (env:roboauto_bletest: eigene Roboauto-App)
    -DMIT_DABBLE
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Dabble hat in ungenutzten Modulen fehlende returns -> nur Warnung statt Abbruch
    ; (die im GamePad-Modul sind in lib/DabbleESP32 bereits korrigiert)
    -Wno-error=return-type
    '-DOTA_PASSWORT="${geheim.ota_passwort}"'
build_unflags =
    -Werror=return-type

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    ; DabbleESP32 liegt lokal in lib/DabbleESP32 (Kopie aus dem Arduino-Ordner)

; ------------------------------------------------------------
; Upload ueber WLAN (ohne Kabel). In VS Code unten in der blauen Leiste
; die Umgebung "env:roboauto_wlan" auswaehlen, dann wie gewohnt Upload (->).
; Klappt "roboauto.local" nicht, hier die IP-Adresse des Autos eintragen.
; ------------------------------------------------------------
[env:roboauto_wlan]
extends = env:roboauto
upload_protocol = espota
upload_port = roboauto.local
upload_flags =
    --auth=${geheim.ota_passwort}

; ------------------------------------------------------------
; TEST: Roboauto-App statt Dabble (eigener Bluetooth-Dienst, siehe docs/app-protokoll.md).
; Alles andere (Webseite, WLAN, Lichter ...) ist gleich. Dabble wird gar nicht erst eingebaut.
; ------------------------------------------------------------
[env:roboauto_bletest]
extends = env:roboauto
build_flags =
    ${env:roboauto.build_flags}
    -UMIT_DABBLE
lib_ignore = DabbleESP32

[env:roboauto_bletest_wlan]
extends = env:roboauto_bletest
upload_protocol = espota
upload_port = roboauto.local
upload_flags =
    --auth=${geheim.ota_passwort}
