; Roboauto - ein Code fuer beide Autos
;   env:roboauto       / roboauto_wlan        ESP32-S3 Super Mini
;   env:roboauto_xiao  / roboauto_xiao_wlan   Seeed Studio XIAO ESP32S3 Sense (Kamera, Mikrofon, SD-Karte)
; Neuaufbau mit PlatformIO, Schritt fuer Schritt

; Passwort fuer WLAN-Updates steht in geheim.ini
[platformio]
extra_configs = geheim.ini
default_envs = roboauto

; ------------------------------------------------------------
; Upload per USB-Kabel
; ------------------------------------------------------------
[env:roboauto]
platform = platformio/espressif32 @ 8.0.0   ; feste Version - GitHub baut damit genau wie dein PC
board = esp32-s3-devkitc-1
framework = arduino

; Super Mini hat 4 MB Flash
board_upload.flash_size = 4MB
; Mehr Platz fuers Programm (WLAN + Bluetooth) und zwei Programmplaetze fuer spaetere
; Updates ueber WLAN: 2 x 1,9 MB statt 2 x 1,25 MB
board_build.partitions = min_spiffs.csv

; Weboberflaeche vor jedem Build mit gzip packen (-> include/webseite_gz.h)
extra_scripts = pre:scripts/webseite_gz.py

; USB-Anschluss des Autos fest einstellen (sonst raet PlatformIO manchmal falsch).
; Aendert sich der Port, hier anpassen - oder beide Zeilen mit ; auskommentieren.
upload_port  = COM8
monitor_port = COM8

; Serieller Monitor ueber den USB-C-Anschluss
monitor_speed = 115200
; Steuerung per Roboauto-App (Bluetooth/WLAN) oder Browser - siehe docs/app-protokoll.md
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DOTA_PASSWORT="${geheim.ota_passwort}"'

lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Teile nur fuer den XIAO Sense (Kamera, Mikrofon, SD-Karte, Akkuwaechter) nicht mitbauen
build_src_filter = +<*> -<akku_max17048.cpp> -<kamera.cpp> -<karte.cpp> -<lernen.cpp> -<medien.cpp> -<mikro.cpp>

; ------------------------------------------------------------
; Upload ueber WLAN (ohne Kabel). In VS Code unten in der blauen Leiste
; die Umgebung "env:roboauto_wlan" auswaehlen, dann wie gewohnt Upload (->).
; Klappt "roboauto.local" nicht, hier die IP-Adresse des Autos eintragen.
; ------------------------------------------------------------
[env:roboauto_wlan]
extends = env:roboauto
upload_protocol = espota
upload_port = roboauto.local
upload_flags =
    --auth=${geheim.ota_passwort}

; ============================================================
; XIAO ESP32S3 Sense (8 MB Flash, 8 MB PSRAM, Kamera, Mikrofon, SD-Karte)
; Anleitung und Pins: docs/xiao-sense.md
; ============================================================
[env:roboauto_xiao]
platform = platformio/espressif32 @ 8.0.0   ; gleiche Version wie beim Super Mini
board = seeed_xiao_esp32s3
framework = arduino

; 8 MB Flash: zwei Programmplaetze mit je 3,2 MB (Updates ueber WLAN) + 1,5 MB Dateispeicher
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; PSRAM (8 MB) einschalten - braucht die Kamera fuer ihre Bildpuffer
board_build.arduino.memory_type = qio_opi

extra_scripts = pre:scripts/webseite_gz.py

; USB-Anschluss: wird normalerweise selbst gefunden. Sonst hier eintragen (z. B. COM9).
; upload_port  = COM9
; monitor_port = COM9

monitor_speed = 115200
build_flags =
    -DROBOAUTO_XIAO
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    '-DOTA_PASSWORT="${geheim.ota_passwort}"'

; Kamera (esp32-camera), Mikrofon (ESP_I2S) und SD gehoeren zum Arduino-Kern
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; Akku ueber den MAX17048 statt ueber den Spannungsteiler
build_src_filter = +<*> -<akku.cpp>

; Upload ueber WLAN (ohne Kabel): Umgebung "env:roboauto_xiao_wlan" waehlen, dann Upload (->).
[env:roboauto_xiao_wlan]
extends = env:roboauto_xiao
upload_protocol = espota
upload_port = roboauto.local
upload_flags =
    --auth=${geheim.ota_passwort}
